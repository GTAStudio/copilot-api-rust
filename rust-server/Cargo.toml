[package]
name = "copilot-api-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[[bin]]
name = "copilot-api-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "json"] }
async-stream = "0.3.6"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "gzip", "socks", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
once_cell = "1.21.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "process"] }
tower-http = { version = "0.7.1", features = ["trace"] }
subtle = "2.6.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
directories = "6.0.0"
regex = "1.13.1"
dialoguer = "0.12.0"
tiktoken-rs = "0.12.0"
arboard = { version = "3.6.1", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
walkdir = "2.5.0"
pest = "2.9.1"
pest_derive = "2.9.1"
process-wrap = { version = "10.0.0", default-features = false, features = ["tokio1", "kill-on-drop", "creation-flags", "job-object", "process-group"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
tempfile = "3.27.0"

name: Verify and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  COPILOT_PROVIDER: copilot
  COPILOT_HOOKS_ENABLED: '0'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-server/target/
            gui-slint/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: |
          cargo fmt --manifest-path rust-server/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path gui-slint/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Coverage Reporter Self-test
        run: ./scripts/report-coverage.ps1 -SelfTest

      - name: Server Tests and Clippy
        run: |
          cargo test --manifest-path rust-server/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path rust-server/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Rust Server
        run: cargo build --manifest-path rust-server/Cargo.toml --release --locked

      - name: GUI Tests and Clippy
        run: |
          cargo test --manifest-path gui-slint/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path gui-slint/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build GUI (with embedded server)
        run: cargo build --manifest-path gui-slint/Cargo.toml --release --locked

      - name: Isolated Release Verification
        run: ./scripts/verify-release.ps1

      - name: Dependency Security
        run: |
          cargo install cargo-audit --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo audit --file rust-server/Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo audit --file gui-slint/Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare Release Artifacts
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item rust-server/target/release/copilot-api-server.exe release/
          Copy-Item gui-slint/target/release/copilot-api-gui.exe release/
          Copy-Item gui-slint/ui/assets/icons/LICENSE release/LUCIDE-LICENSE.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: copilot-api-rust-windows
          path: release/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: copilot-api-rust-windows
          path: release/
      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            release/copilot-api-server.exe
            release/copilot-api-gui.exe
            release/LUCIDE-LICENSE.txt
          body: |
            ## Copilot API Rust ${{ github.ref_name }}

            ### Downloads
            - **copilot-api-gui.exe** - GUI with embedded server (recommended)
            - **copilot-api-server.exe** - Standalone server (CLI only)

            ### Usage
            1. Run `copilot-api-gui.exe`
            2. Open **服务连接** and click **登录 GitHub Copilot** to authenticate
            3. Click **启动服务**
            4. Use `http://localhost:PORT` as API endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
